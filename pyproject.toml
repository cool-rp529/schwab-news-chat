[project]
name = "newschat"
version = "0.1.0"
description = "Chat over a fixed set of financial news articles with grounded, cited summaries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.scripts]
newschat = "newschat.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newschat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "llm: exercises the Claude CLI; skipped unless NEWSCHAT_RUN_LLM_TESTS=1 and claude is on PATH",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["newschat"]

[[tool.mypy.overrides]]
module = ["yaml", "uvicorn"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["newschat"]
