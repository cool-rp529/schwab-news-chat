# Three tiers. Seeded: asserted thresholds. Paraphrase: headline-disjoint wording — each
# question shares no non-alias, non-stopword content word with the target article's TITLE
# (body overlap is fine; full body-disjointness is impossible for an on-topic question) — the
# tier that can disconfirm the no-embeddings bet; reported, held to a lower bar. Thematic:
# comparative/aggregate questions; ticker coverage reported unasserted because two of the
# five are refused outright by the absolute gate, which is a property worth measuring rather
# than a threshold worth passing.
k: 5
